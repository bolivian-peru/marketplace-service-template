name: Deploy API Service

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Cloudflare Tunnel
        run: |
          curl -L --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Setup Environment
        run: |
          cat > .env << 'EOF'
          WALLET_ADDRESS=RTC6d1f27d28961279f1034d9561c2403697eb55602
          PROXY_USERNAME=agent_caa9c77cbeb3f827
          PROXY_PASSWORD=J6aG3GD3QLuf4nDpCX71W2wFYTieJ6T9RtsXAuDhPFTE
          PROXY_HOST=proxy.proxies.sx
          PROXY_PORT=80
          NODE_ENV=production
          EOF

      - name: Start Tunnel & Service
        run: |
          # Start cloudflare tunnel in background
          cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel-url.txt 2>&1 &
          TUNNEL_PID=$!
          
          # Start the service in background
          bun run dev > /tmp/service.log 2>&1 &
          SERVICE_PID=$!
          
          # Wait for services to start
          sleep 10
          
          # Extract tunnel URL
          TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/tunnel-url.txt | head -1)
          echo "TUNNEL_URL=$TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "$TUNNEL_URL" > /tmp/result.txt
          
          # Health check
          curl -s http://localhost:3000/health && echo " - Service OK"
          
          echo "Tunnel PID: $TUNNEL_PID, Service PID: $SERVICE_PID"
          echo "Service log:"
          tail -20 /tmp/service.log

      - name: Save Public URL
        uses: actions/upload-artifact@v4
        with:
          name: deployment-url
          path: /tmp/result.txt
